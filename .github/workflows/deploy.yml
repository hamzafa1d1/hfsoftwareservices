name: Check portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static pages
        run: python3 scripts/check-site.py
      - name: Confirm Upwork variant is current
        run: |
          python3 scripts/build-upwork.py
          git diff --exit-code -- upwork/index.html
